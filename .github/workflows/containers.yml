name: Build hosting images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding API_ORIGIN and CLERK_PUBLISHABLE_KEY variables
        type: choice
        options: [staging, production]
        required: true
        default: staging

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.target }}:${{ inputs.environment }}-${{ github.sha }}
          build-args: |
            DEPLOY_ENV=${{ inputs.environment }}
            VITE_API_URL=${{ vars.API_ORIGIN }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ inputs.environment }}
