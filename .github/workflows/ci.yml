name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first so generated artifacts (e.g. TanStack route tree) exist
      # before the type-check step runs.
      - name: Build
        run: pnpm build

      - name: Bundle Node API
        run: pnpm --filter @opensociety/api build:node

      - name: Type-check
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  hosting:
    name: Hosting containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build API image
        run: docker build --target api -t opensociety-api:test .
      - name: Build staging web image
        run: |
          docker build --target web -t opensociety-web:test \
            --build-arg DEPLOY_ENV=staging \
            --build-arg VITE_API_URL=https://api.example.com \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_test_ZXhhbXBsZS5jb20k .
      - name: Smoke-test containers without external services
        run: node --test scripts/hosting-smoke.test.mjs
